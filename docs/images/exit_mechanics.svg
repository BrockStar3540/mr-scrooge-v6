<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="960" height="470" fill="#0d1117"/>
  <text x="480" y="28" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">One trade, two geometries — the MFE/MAE swing and how each exit class secures the green</text>

  <!-- ═══════════ LEFT PANEL: FAST slice ═══════════ -->
  <text x="250" y="54" text-anchor="middle" fill="#ffb547" font-size="13" font-weight="700">🟠 FAST cell (NY fade) — slice the pop before it fades</text>
  <!-- axes -->
  <line x1="60" y1="70" x2="60" y2="360" stroke="#30363d" stroke-width="1"/>
  <line x1="60" y1="250" x2="450" y2="250" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="52" y="254" text-anchor="end" fill="#8b949e" font-size="10">0p</text>
  <text x="52" y="214" text-anchor="end" fill="#8b949e" font-size="10">+4p</text>
  <text x="52" y="304" text-anchor="end" fill="#8b949e" font-size="10">−5p</text>
  <text x="255" y="378" text-anchor="middle" fill="#8b949e" font-size="10">minutes since entry →</text>
  <!-- toll band -->
  <rect x="60" y="232" width="390" height="36" fill="#30363d" opacity="0.55"/>
  <text x="66" y="245" fill="#8b949e" font-size="9.5">the toll — round-trip spread: entry is born ~2p under water</text>
  <!-- TP + SL + timeout -->
  <line x1="60" y1="210" x2="450" y2="210" stroke="#ffb547" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="446" y="226" text-anchor="end" fill="#ffb547" font-size="10.5">TP limit @ +4p (cost floor — a limit order cannot slip)</text>
  <line x1="60" y1="300" x2="450" y2="300" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>
  <text x="446" y="313" text-anchor="end" fill="#e74c3c" font-size="10" opacity="0.8">SL −5p</text>
  <line x1="320" y1="70" x2="320" y2="360" stroke="#8b949e" stroke-width="1" stroke-dasharray="2 6" opacity="0.7"/>
  <text x="324" y="82" fill="#8b949e" font-size="10">60m timeout — flat, win or lose</text>
  <!-- MAE bracket -->
  <path d="M 118 252 L 112 252 L 112 276 L 118 276" stroke="#e74c3c" fill="none" stroke-width="1.2"/>
  <text x="106" y="268" text-anchor="end" fill="#e74c3c" font-size="10">MAE −2.6p</text>
  <!-- price path to TP fill -->
  <polyline points="60,250 74,256 88,249 100,262 112,276 126,265 140,255 152,258 166,243 180,232 194,222 206,210"
            fill="none" stroke="#e6edf3" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- ghost fade path -->
  <polyline points="206,210 220,219 236,214 252,231 268,247 286,262 306,274 326,286 348,297 372,305 400,312 430,316"
            fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.55"/>
  <text x="300" y="332" fill="#8b949e" font-size="10" opacity="0.85">the fade the slice never meets</text>
  <!-- green exit -->
  <circle cx="206" cy="210" r="6" fill="#2ecc71"/>
  <circle cx="206" cy="210" r="10" fill="none" stroke="#2ecc71" opacity="0.5"/>
  <text x="214" y="178" fill="#2ecc71" font-size="11.5" font-weight="700">filled +4p · 35 min · green banked</text>
  <!-- travel bracket -->
  <path d="M 60 226 L 60 206 M 56 206 L 64 206 M 56 226 L 64 226" stroke="#ffb547" stroke-width="1" opacity="0.9"/>
  <text x="66" y="192" fill="#ffb547" font-size="9.5" opacity="0.9">mid must travel TP + spread to fill</text>

  <!-- ═══════════ RIGHT PANEL: LONG runner ═══════════ -->
  <text x="720" y="54" text-anchor="middle" fill="#c47fff" font-size="13" font-weight="700">🟣 LONG cell (Asia/London trend) — ratchet the runner, give nothing back</text>
  <line x1="530" y1="70" x2="530" y2="360" stroke="#30363d" stroke-width="1"/>
  <line x1="530" y1="250" x2="940" y2="250" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="522" y="254" text-anchor="end" fill="#8b949e" font-size="10">0p</text>
  <text x="522" y="198" text-anchor="end" fill="#8b949e" font-size="10">+8p</text>
  <text x="522" y="140" text-anchor="end" fill="#8b949e" font-size="10">+16p</text>
  <text x="735" y="378" text-anchor="middle" fill="#8b949e" font-size="10">hours since entry →   (winners here historically hold 2.5–3.5h)</text>
  <!-- projected excursion envelope -->
  <polygon points="530,250 940,138 940,292 530,250" fill="#c47fff" opacity="0.07"/>
  <polyline points="530,250 940,138" fill="none" stroke="#c47fff" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>
  <polyline points="530,250 940,292" fill="none" stroke="#c47fff" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>
  <text x="936" y="112" text-anchor="end" fill="#c47fff" font-size="10" opacity="0.85">projected MFE — this cell's travel builds for 4h (2.3× the first hour)</text>
  <text x="936" y="306" text-anchor="end" fill="#c47fff" font-size="10" opacity="0.85">projected MAE floor</text>
  <!-- toll band -->
  <rect x="530" y="239" width="410" height="22" fill="#30363d" opacity="0.55"/>
  <!-- engage line -->
  <line x1="530" y1="194" x2="940" y2="194" stroke="#c47fff" stroke-width="1.2" stroke-dasharray="7 4" opacity="0.9"/>
  <text x="536" y="186" fill="#c47fff" font-size="10">lock engages only past +8p</text>
  <!-- price path -->
  <polyline points="530,250 545,259 558,270 572,278 588,268 602,256 616,240 630,224 645,212 660,199 673,187 690,176 705,166 720,159 735,163 750,172 765,166 780,155 795,149 810,142 825,138 840,144 855,152 870,148 885,158 900,164 912,169"
            fill="none" stroke="#e6edf3" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- MAE label -->
  <path d="M 578 252 L 572 252 L 572 278 L 578 278" stroke="#e74c3c" fill="none" stroke-width="1.2"/>
  <text x="566" y="270" text-anchor="end" fill="#e74c3c" font-size="10">MAE −4p</text>
  <!-- MFE label -->
  <text x="825" y="128" text-anchor="middle" fill="#e6edf3" font-size="10">MFE +16p</text>
  <!-- ratchet lock staircase -->
  <polyline points="673,222 720,222 720,187 810,187 810,169 912,169"
            fill="none" stroke="#2ecc71" stroke-width="2" stroke-linejoin="round"/>
  <text x="676" y="236" fill="#2ecc71" font-size="10">lock +4p</text>
  <text x="726" y="201" fill="#2ecc71" font-size="10">lock +9p</text>
  <text x="816" y="163" fill="#2ecc71" font-size="10">lock +11.5p</text>
  <!-- trail arrow -->
  <line x1="825" y1="138" x2="825" y2="167" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <text x="831" y="156" fill="#8b949e" font-size="9.5">1.0×ATR trail</text>
  <defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs>
  <!-- green exit -->
  <circle cx="912" cy="169" r="6" fill="#2ecc71"/>
  <circle cx="912" cy="169" r="10" fill="none" stroke="#2ecc71" opacity="0.5"/>
  <text x="902" y="214" text-anchor="end" fill="#2ecc71" font-size="11.5" font-weight="700">stopped into profit: +11.5p locked</text>

  <!-- bottom shared caption -->
  <text x="480" y="416" text-anchor="middle" fill="#8b949e" font-size="11.5">Every trade swings between its MFE (best excursion) and MAE (worst) — both measured per cell from 8 years of broker-anchored data.</text>
  <text x="480" y="434" text-anchor="middle" fill="#8b949e" font-size="11.5">The exit engine is matched to that geometry: fade cells bank the pop at the cost floor; trend cells ratchet a rising stop under the move.</text>
  <text x="480" y="452" text-anchor="middle" fill="#8b949e" font-size="11.5">Either way the mechanism only ever moves the exit toward green — and freezes entirely during the daily rollover spread blowout.</text>
</svg>
